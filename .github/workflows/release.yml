name: Release

# Push a tag like v0.1.0 to publish that version to Maven Central.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # writes ~/.m2/settings.xml with a <server id="central"> reading these env vars
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || [[ "$VERSION" == *SNAPSHOT* ]]; then
            echo "Tag $GITHUB_REF_NAME is not a release version like v1.2.3" >&2
            exit 1
          fi
          mvn -B -q org.codehaus.mojo:versions-maven-plugin:2.22.0:set \
            -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Build, sign and publish to Maven Central
        run: mvn -B -P release deploy -Dproject.build.outputTimestamp="$(git log -1 --format=%cI)"
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes target/mu-openapi-routes-*.jar
        env:
          GH_TOKEN: ${{ github.token }}
